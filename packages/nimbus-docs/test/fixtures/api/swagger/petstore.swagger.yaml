swagger: "2.0"
info:
  title: Pet Store
  version: 1.0.0
host: api.example.com
basePath: /v1
schemes: [https]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  apiKey: { type: apiKey, in: header, name: X-API-Key }
  basic: { type: basic }
  oauth: { type: oauth2, flow: accessCode, authorizationUrl: "https://auth.example.com/authorize", tokenUrl: "https://auth.example.com/token", scopes: { "pets:write": Modify pets } }
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - { name: limit, in: query, required: true, type: integer, format: int32, maximum: 100 }
        - { name: status, in: query, type: string, enum: [available, sold] }
      responses:
        "200":
          description: A list of pets.
          schema: { type: array, items: { $ref: "#/definitions/Pet" } }
    post:
      operationId: createPet
      tags: [pets]
      security: [{ oauth: ["pets:write"] }]
      parameters:
        - in: body
          name: body
          required: true
          schema: { $ref: "#/definitions/Pet" }
      responses:
        "201": { description: Created., schema: { $ref: "#/definitions/Pet" } }
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      security: [{ basic: [] }]
      parameters:
        - { name: petId, in: path, required: true, type: string }
      responses:
        "200": { description: The pet., schema: { $ref: "#/definitions/Pet" } }
        "404": { description: Not found., schema: { $ref: "#/definitions/Error" } }
definitions:
  NewPet:
    type: object
    required: [name]
    properties:
      name: { type: string, example: Rex }
      tag: { type: string }
  Pet:
    allOf:
      - $ref: "#/definitions/NewPet"
      - type: object
        required: [id]
        properties:
          id: { type: integer, format: int64, readOnly: true }
  Error:
    type: object
    properties:
      code: { type: integer }
      message: { type: string }

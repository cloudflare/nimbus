          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
      security: []
components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - request_id
          properties:
            type:
              type: string
              description: Error category.
              enum:
                - invalid_request
                - authentication
                - permission
                - not_found
                - rate_limited
                - server
              example: invalid_request
            code:
              type: string
              description: Stable machine-readable code.
              example: parameter_out_of_range
            message:
              type: string
              description: Human-readable explanation.
              example: latitude must be between -90 and 90.
            param:
              type: string
              description: The parameter that caused the error, when there is one.
              example: latitude
            request_id:
              type: string
              description: Quote this when contacting support.
              example: req_7Kq2LmB3x9
    Coordinates:
      type: object
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          description: Latitude in decimal degrees.
          example: 59.9139
        lon:
          type: number
          description: Longitude in decimal degrees.
          example: 10.7522
    Location:
      type: object
      description: A named place weather can be requested for.
      required:
        - id
        - name
        - country
        - timezone
      properties:
        id:
          type: string
          description: Location id.
          example: loc_oslo_no
        name:
          type: string
          description: Place name.
          example: Oslo
        region:
          type: string
          description: First-level administrative region.
          example: Oslo
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NO
        timezone:
          type: string
          description: IANA time zone.
          example: Europe/Oslo
        lat:
          type: number
          description: Latitude.
          example: 59.9139
        lon:
          type: number
          description: Longitude.
          example: 10.7522
    Conditions:
      type: object
      description: Weather at one moment. v1 reports imperial units only.
      required:
        - temp_f
        - condition
      properties:
        temp_f:
          type: number
          description: Air temperature, °F.
          example: 26.6
        feels_like_f:
          type: number
          description: Apparent temperature, °F.
          example: 19.4
        humidity:
          type: integer
          description: Relative humidity, percent.
          example: 86
        pressure_mb:
          type: number
          description: Sea-level pressure, millibars.
          example: 1012.4
        wind_mph:
          type: number
          description: Sustained wind speed, mph.
          example: 9.2
        wind_dir:
          type: string
          description: Compass direction the wind blows from.
          example: NNE
        visibility_mi:
          type: number
          description: Visibility, miles.
          example: 6.2
        condition:
          type: string
          description: Plain-language summary.
          example: Light snow
        icon:
          type: string
          description: Icon name.
          example: snow
    HourlyForecast:
      type: object
      required:
        - time
        - temp_f
      properties:
        time:
          type: string
          description: Start of the hour (UTC).
          example: 2026-01-14T08:00:00Z
          format: date-time
        temp_f:
          type: number
          description: Temperature, °F.
          example: 26.1
        precip_in:
          type: number
          description: Precipitation, inches.
          example: 0.01
        precip_chance:
          type: integer
          description: Chance of precipitation, percent.
          example: 40
        wind_mph:
          type: number
          description: Wind speed, mph.
          example: 8.7
        condition:
          type: string
          description: Summary.
          example: Light snow
    DailyForecast:
      type: object
      required:
        - date
        - high_f
        - low_f
      properties:
        date:
          type: string
          description: Local date.
          example: 2026-01-14
          format: date
        high_f:
          type: number
          description: High, °F.
          example: 30.2
        low_f:
          type: number
          description: Low, °F.
          example: 21
        precip_chance:
          type: integer
          description: Chance of precipitation, percent.
          example: 60
        sunrise:
          type: string
          description: Local sunrise, HH:MM.
          example: 09:10
        sunset:
          type: string
          description: Local sunset, HH:MM.
          example: 15:32
        condition:
          type: string
          description: Summary.
          example: Snow showers
    Observation:
      type: object
      description: A measurement reported by a station.
      required:
        - id
        - station
        - observed_at
        - conditions
      properties:
        id:
          type: string
          description: Observation id.
          example: "8812004"
        station:
          type: object
          properties:
            id:
              type: string
              description: Station id.
              example: "01492"
            name:
              type: string
              description: Station name.
              example: Oslo – Blindern
        observed_at:
          type: string
          description: When the measurement was taken (UTC).
          example: 2026-01-14T07:50:00Z
          format: date-time
        conditions:
          $ref: "#/components/schemas/Conditions"
    Station:
      type: object
      description: A place that reports weather measurements.
      required:
        - id
        - name
        - country
        - active
      properties:
        id:
          type: string
          description: Station id.
          example: "01492"
        icao:
          type:
            - string
            - "null"
          description: ICAO code, for airport stations.
        name:
          type: string
          description: Station name.
          example: Oslo – Blindern
        lat:
          type: number
          description: Latitude.
          example: 59.9423
        lon:
          type: number
          description: Longitude.
          example: 10.72
        elevation_ft:
          type: number
          description: Elevation, feet.
          example: 308
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NO
        active:
          type: boolean
          description: Whether the station reported in the last 24 hours.
          example: true
    Alert:
      type: object
      description: A weather alert.
      required:
        - id
        - level
        - title
        - starts
        - expires
      properties:
        id:
          type: string
          description: Alert id.
          example: a-20260114-0042
        level:
          type: string
          description: Alert level.
          enum:
            - advisory
            - watch
            - warning
          example: warning
        title:
          type: string
          description: Headline.
          example: Heavy snow warning for Oslo and Akershus
        description:
          type: string
          description: Full text.
          example: 15–25 cm of snow expected between 18:00 and 06:00…
        regions:
          type: array
          items:
            type: string
            description: ""
            example: Oslo
        starts:
          type: string
          description: Start.
          example: 2026-01-14T17:00:00Z
          format: date-time
        expires:
          type: string
          description: End.
          example: 2026-01-15T05:00:00Z
          format: date-time
    Layer:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Layer id.
          enum:
            - radar
          example: radar
        name:
          type: string
          description: Display name.
          example: Precipitation radar
        min_zoom:
          type: integer
          description: ""
          example: 0
        max_zoom:
          type: integer
          description: ""
          example: 10
        update_interval:
          type: integer
          description: Minutes between new frames.
          example: 5
    ApiKey:
      type: object
      required:
        - id
        - name
        - prefix
        - created_at
      properties:
        id:
          type: string
          description: Key id.
          example: "4211"
        name:
          type: string
          description: A label for the key.
          example: Production
        prefix:
          type: string
          description: First characters, for recognizing the key in logs.
          example: wx_live_9bR4
        created_at:
          type: string
          description: ""
          example: 2025-03-11T12:00:00Z
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          description: ""
          example: 2026-01-14T07:59:41Z
          format: date-time
    CreatedApiKey:
      type: object
      required:
        - key
        - secret
      properties:
        key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The full key. Shown only once.
          example: wx_live_9bR4Tq0sXk1mZp8vYw2c
  responses:
    "400":
      description: The request was malformed or a parameter was out of range.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: The API key is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "429":
      description: Too many requests. Retry after the time in `Retry-After`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 12
        RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
            example: 0
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: key
      description: Your API key, as the `key` query parameter.

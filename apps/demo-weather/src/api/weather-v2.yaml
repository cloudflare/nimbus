    get:
      operationId: listStrikes
      summary: List recent strikes
      description: Strikes inside a bounding box in the last 60 minutes.
      tags:
        - Lightning
      parameters:
        - name: bbox
          in: query
          required: true
          description: west,south,east,north.
          schema:
            type: string
            description: ""
            example: 4.5,57.9,12.5,62.0
        - name: since
          in: query
          required: false
          description: Only strikes after this time.
          schema:
            type: string
            description: ""
            example: 2026-07-02T14:00:00Z
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `next_cursor`.
          schema:
            type: string
            description: ""
            example: c_2xQm8uY0
        - name: limit
          in: query
          required: false
          description: Maximum results to return.
          schema:
            type: integer
            description: ""
            example: 50
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Strikes, newest first.
                required:
                  - data
                  - next_cursor
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          description: ""
                          example: 2026-07-02T14:03:17.402Z
                          format: date-time
                        position:
                          $ref: "#/components/schemas/Coordinates"
                        type:
                          type: string
                          description: ""
                          enum:
                            - cloud_to_ground
                            - intra_cloud
                          example: cloud_to_ground
                        peak_current_ka:
                          type: number
                          description: ""
                          example: -18.4
                  next_cursor:
                    type:
                      - string
                      - "null"
                    description: Cursor for the next page, or `null` on the last page.
                    example: c_2xQm8uY0
                  has_more:
                    type: boolean
                    description: Whether another page exists.
                    example: true
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"

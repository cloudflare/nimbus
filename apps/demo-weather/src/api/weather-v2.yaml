          description: Knots.
          example: 105
        min_pressure:
          type: number
          description: hPa.
          example: 958
        position:
          $ref: "#/components/schemas/Coordinates"
        movement:
          type: object
          properties:
            direction:
              type: integer
              description: ""
              example: 300
            speed:
              type: number
              description: Knots.
              example: 12
        advisory_at:
          type: string
          description: ""
          example: 2025-08-19T15:00:00Z
          format: date-time
    ApiKey:
      type: object
      required:
        - id
        - name
        - prefix
        - created_at
      properties:
        id:
          type: string
          description: Key id.
          example: key_9bR4
        name:
          type: string
          description: A label for the key.
          example: Production
        prefix:
          type: string
          description: First characters, for recognizing the key in logs.
          example: wx_live_9bR4
        scopes:
          type: array
          items:
            type: string
            description: ""
            enum:
              - weather:read
              - stations:write
              - alerts:manage
              - exports:create
            example: weather:read
        allowed_origins:
          type: array
          description: Browser origins allowed to use this key. Empty means server-side only.
          items:
            type: string
            description: ""
            example: https://example.com
        created_at:
          type: string
          description: ""
          example: 2025-03-11T12:00:00Z
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          description: ""
          example: 2026-01-14T07:59:41Z
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          description: ""
          example: 2026-12-31T23:59:59Z
          format: date-time
    CreatedApiKey:
      type: object
      required:
        - key
        - secret
      properties:
        key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The full key. Shown only once.
          example: wx_live_9bR4Tq0sXk1mZp8vYw2c
    Member:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: string
          description: ""
          example: usr_2Hc8
        email:
          type: string
          description: ""
          example: ingrid@example.com
        role:
          type: string
          description: ""
          enum:
            - owner
            - admin
            - developer
            - billing
            - viewer
          example: developer
        joined_at:
          type: string
          description: ""
          example: 2025-04-02T08:30:00Z
          format: date-time
  responses:
    "400":
      description: The request was malformed or a parameter was out of range.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: The API key is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "429":
      description: Too many requests. Retry after the time in `Retry-After`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 12
        RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
            example: 0
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Your API key: `Authorization: Bearer wx_live_…`."
    oauth2:
      type: oauth2
      description: Client credentials for account management.
      flows:
        clientCredentials:
          tokenUrl: https://auth.weather.example/oauth/token
          scopes:
            account: Manage keys, members, and billing.

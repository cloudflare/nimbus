  /locations/{location_id}/nearby-stations:
    get:
      operationId: listNearbyStations
      summary: List stations near a location
      description: Stations within `radius` kilometres, nearest first.
      tags:
        - Locations
      parameters:
        - name: location_id
          in: path
          required: true
          description: Location id.
          schema:
            type: string
            example: loc_oslo_no
        - name: radius
          in: query
          required: false
          description: Search radius in kilometres.
          schema:
            type: number
            description: ""
            example: 25
            maximum: 200
            default: 25
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `next_cursor`.
          schema:
            type: string
            description: ""
            example: c_2xQm8uY0
        - name: limit
          in: query
          required: false
          description: Maximum results to return.
          schema:
            type: integer
            description: ""
            example: 50
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Stations, nearest first.
                required:
                  - data
                  - next_cursor
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        station:
                          $ref: "#/components/schemas/Station"
                        distance_km:
                          type: number
                          description: Distance from the location.
                          example: 3.4
                  next_cursor:
                    type:
                      - string
                      - "null"
                    description: Cursor for the next page, or `null` on the last page.
                    example: c_2xQm8uY0
                  has_more:
                    type: boolean
                    description: Whether another page exists.
                    example: true
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
  /timezones/{timezone}:
    get:
      operationId: getTimezone
      summary: Get a time zone
      description: Current offset and the next daylight-saving transition.
      tags:
        - Locations
      parameters:
        - name: timezone
          in: path
          required: true
          description: IANA time zone, URL-encoded.
          schema:
            type: string
            example: Europe%2FOslo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: IANA id.
                    example: Europe/Oslo
                  utc_offset:
                    type: string
                    description: Current offset.
                    example: +01:00
                  is_dst:
                    type: boolean
                    description: Whether daylight saving time is in effect.
                    example: false
                  next_transition:
                    type: string
                    description: Next offset change.
                    example: 2026-03-29T01:00:00Z
                    format: date-time
        "400":
          $ref: "#/components/responses/400"
        "401":

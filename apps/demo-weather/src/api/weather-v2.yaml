  /exports:
    post:
      operationId: createExport
      summary: Start a bulk export
      description: Exports run in the background. Poll the export, or pass `notify_url` to get a POST when it finishes.
      tags:
        - History
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - start_date
                - end_date
              properties:
                kind:
                  type: string
                  description: What to export.
                  enum:
                    - hourly
                    - daily
                    - observations
                  example: hourly
                points:
                  type: array
                  items:
                    type: object
                    properties:
                      latitude:
                        type: number
                        description: ""
                        example: 59.9139
                      longitude:
                        type: number
                        description: ""
                        example: 10.7522
                stations:
                  type: array
                  items:
                    type: string
                    description: ""
                    example: stn_01492
                start_date:
                  type: string
                  description: ""
                  example: 2015-01-01
                  format: date
                end_date:
                  type: string
                  description: ""
                  example: 2024-12-31
                  format: date
                variables:
                  type: array
                  items:
                    type: string
                    description: ""
                    example: temperature
                format:
                  type: string
                  description: File format.
                  enum:
                    - csv
                    - parquet
                    - netcdf
                  example: csv
                notify_url:
                  type: string
                  description: ""
                  example: https://example.com/hooks/export-done
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
    get:
      operationId: listExports
      summary: List exports
      tags:
        - History
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `next_cursor`.
          schema:
            type: string
            description: ""
            example: c_2xQm8uY0
        - name: limit
          in: query
          required: false
          description: Maximum results to return.
          schema:
            type: integer
            description: ""
            example: 50
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Exports, newest first.
                required:
                  - data
                  - next_cursor
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Export"
                  next_cursor:
                    type:
                      - string
                      - "null"
                    description: Cursor for the next page, or `null` on the last page.
                    example: c_2xQm8uY0
                  has_more:
                    type: boolean
                    description: Whether another page exists.
                    example: true
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"

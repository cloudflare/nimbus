                    example: Light snow starting in 15 minutes.
                  minutes:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          description: Start of the step.
                          example: 2026-01-14T08:15:00Z
                          format: date-time
                        intensity:
                          type: number
                          description: Precipitation rate, mm/h.
                          example: 0.6
                        probability:

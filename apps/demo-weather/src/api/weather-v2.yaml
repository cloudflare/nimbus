  /forecasts/minutely:
    get:
      operationId: getMinutelyPrecipitation
      summary: Get minute-by-minute precipitation
      description: Precipitation intensity for the next two hours in five-minute steps, from radar nowcasting.
      tags:
        - Forecasts
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, WGS 84.
          schema:
            type: number
            description: ""
            example: 59.9139
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, WGS 84.

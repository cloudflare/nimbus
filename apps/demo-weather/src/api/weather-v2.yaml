openapi: 3.1.0
info:
  title: Weather API
  version: 2.8.0
  description: Forecasts, observations, alerts, imagery, and climate data for anywhere on Earth.
  contact:
    name: Weather API support
    email: support@weather.example
  termsOfService: https://weather.example/terms
servers:
  - url: https://api.weather.example/v2
security:
  - bearer: []
tags:
  - name: Locations
    description: Find places by name or coordinates.
  - name: Forecasts
    description: Hourly, daily, and minute-by-minute forecasts for any point.
  - name: Observations
    description: Measured weather from ground stations.
  - name: Stations
    description: The public station network, and private stations you operate and report from.
  - name: Alerts
    description: Official warnings for severe weather.
  - name: Imagery
    description: Radar, satellite, and forecast map tiles in Web Mercator.
  - name: History
    description: Hourly and daily records back to 1940, from reanalysis and station archives.
  - name: Air quality
    description: Pollutant concentrations, AQI, and pollen.
  - name: Marine
    description: Waves, tides, and sea temperature.
  - name: Aviation
    description: METAR, TAF, and hazards for flight planning. Not a substitute for an official briefing.
  - name: Tropical
    description: Active tropical cyclones, tracks, and forecast cones.
  - name: Lightning
    description: Strikes detected by the lightning network.
  - name: Agriculture
    description: Soil, frost, and crop-growth indicators.
  - name: Energy
    description: Solar and wind resource forecasts for generation planning.
  - name: Account
    description: API keys, usage, and your organization.
  - name: Service
    description: Health checks.
x-tagGroups:
  - name: Weather
    tags:
      - Locations
      - Forecasts
      - Observations
      - Stations
      - Alerts
  - name: Maps
    tags:
      - Imagery
  - name: Climate
    tags:
      - History
  - name: Environment
    tags:
      - Air quality
      - Marine
      - Aviation
      - Tropical
      - Lightning
  - name: Industries
    tags:
      - Agriculture
      - Energy
  - name: Platform
    tags:
      - Account
      - Service
paths:
  /locations/search:
    get:
      operationId: searchLocations
      summary: Search locations
      description: Find places whose name starts with the query, ranked by population.
      tags:
        - Locations
      parameters:
        - name: q
          in: query
          required: true
          description: Place name, or the start of one.
          schema:
            type: string
            description: ""
            example: Osl
        - name: country
          in: query
          required: false
          description: Limit to one ISO 3166-1 alpha-2 country.
          schema:
            type: string
            description: ""
            example: NO
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `next_cursor`.
          schema:
            type: string
            description: ""
            example: c_2xQm8uY0
        - name: limit
          in: query
          required: false
          description: Maximum results to return.
          schema:
            type: integer
            description: ""
            example: 50
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Matching locations.
                required:
                  - data
                  - next_cursor
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Location"
                  next_cursor:
                    type:
                      - string
                      - "null"
                    description: Cursor for the next page, or `null` on the last page.
                    example: c_2xQm8uY0
                  has_more:
                    type: boolean
                    description: Whether another page exists.
                    example: true
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
  /locations/reverse:
    get:
      operationId: reverseGeocode
      summary: Find the nearest location
      description: Return the closest named place to a coordinate.
      tags:
        - Locations
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, WGS 84.
          schema:
            type: number
            description: ""
            example: 59.9139
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, WGS 84.
          schema:
            type: number
            description: ""
            example: 10.7522
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"

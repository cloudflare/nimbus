            application/json:
              schema:
                type: object
                description: Daily forecast.
                required:
                  - location
                  - days
                properties:
                  location:
                    $ref: "#/components/schemas/Location"
                  generated_at:
                    type: string
                    description: When the model run behind this forecast finished.
                    example: 2026-01-14T06:00:00Z
                    format: date-time
                  units:
                    type: string
                    description: Units used in this response.
                    enum:
                      - metric
                      - imperial
                      - si
                    example: metric
                  model:
                    type: string
                    description: Forecast model.
                    example: gfs-ecmwf-blend-4
                  days:
                    type: array
                    items:

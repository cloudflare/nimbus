          schema:
            type: number
            description: ""
            example: 10.7522
            minimum: -180
            maximum: 180
        - name: units
          in: query
          required: false
          description: Unit system for every measurement in the response.
          schema:
            type: string
            description: ""
            enum:
              - metric
              - imperial
              - si
            example: metric
        - name: days
          in: query
          required: false
          description: Number of days.
          schema:
            type: integer
            description: ""
            example: 7
            minimum: 1
            maximum: 16
            default: 7
      responses:
        "200":
          description: OK

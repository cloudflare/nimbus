components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - request_id
          properties:
            type:
              type: string
              description: Error category.
              enum:
                - invalid_request
                - authentication
                - permission
                - not_found
                - rate_limited
                - server
              example: invalid_request
            code:
              type: string
              description: Stable machine-readable code.
              example: parameter_out_of_range
            message:
              type: string
              description: Human-readable explanation.
              example: latitude must be between -90 and 90.
            param:
              type: string
              description: The parameter that caused the error, when there is one.
              example: latitude
            request_id:
              type: string
              description: Quote this when contacting support.
              example: req_7Kq2LmB3x9
    Coordinates:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          description: Latitude in decimal degrees.
          example: 59.9139
        longitude:
          type: number
          description: Longitude in decimal degrees.
          example: 10.7522
        elevation:
          type: number
          description: Elevation above mean sea level, in metres.
          example: 23
    Location:
      type: object
      description: A named place weather can be requested for.
      required:
        - id
        - name
        - country
        - timezone
      properties:
        id:
          type: string
          description: Location id.
          example: loc_oslo_no
        name:
          type: string
          description: Place name.
          example: Oslo
        region:
          type: string
          description: First-level administrative region.
          example: Oslo
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NO
        timezone:
          type: string
          description: IANA time zone.
          example: Europe/Oslo
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        population:
          type: integer
          description: Population, when known.
          example: 709037
    Wind:
      type: object
      required:
        - speed
        - direction
      properties:
        speed:
          type: number
          description: Sustained speed in the requested units.
          example: 4.1
        gust:
          type:
            - number
            - "null"
          description: Gust speed, when reported.
          example: 7.6
        direction:
          type: integer
          description: Direction the wind blows from, degrees true.
          example: 20
          minimum: 0
          maximum: 360
    Condition:
      type: object
      required:
        - code
        - label
      properties:
        code:
          type: integer
          description: WMO weather interpretation code.
          example: 71
        label:
          type: string
          description: Condition label.
          enum:
            - clear
            - mainly_clear
            - partly_cloudy
            - overcast
            - fog
            - rime_fog
            - drizzle_light
            - drizzle
            - drizzle_dense
            - freezing_drizzle
            - rain_light
            - rain
            - rain_heavy
            - freezing_rain
            - snow_light
            - snow
            - snow_heavy
            - snow_grains
            - showers
            - showers_heavy
            - snow_showers
            - thunderstorm
            - thunderstorm_hail
          example: snow_light
        text:
          type: string
          description: Localized summary.
          example: Light snow
    Conditions:
      type: object
      description: Weather at one moment.
      required:
        - temperature
        - humidity
        - wind
        - condition
      properties:
        temperature:
          type: number
          description: Air temperature in the requested units.
          example: -3
        feels_like:
          type: number
          description: Apparent temperature.
          example: -7
        dew_point:
          type: number
          description: Dew point.
          example: -5.1
        humidity:
          type: integer
          description: Relative humidity, percent.
          example: 86
          minimum: 0
          maximum: 100
        pressure:

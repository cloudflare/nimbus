  /forecasts/batch:
    post:
      operationId: batchForecasts
      summary: Get forecasts for many points
      description: Up to 100 points in one request. Each point is billed as one call.
      tags:
        - Forecasts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
                - kind
              properties:
                points:
                  type: array
                  items:
                    type: object
                    required:
                      - latitude
                      - longitude
                    properties:
                      latitude:
                        type: number
                        description: ""
                        example: 59.9139
                      longitude:
                        type: number
                        description: ""
                        example: 10.7522
                      ref:
                        type: string
                        description: Your own id, echoed back.
                        example: warehouse-12
                  maxItems: 100
                kind:
                  type: string
                  description: Forecast kind.
                  enum:
                    - daily
                    - hourly
                  example: daily
                units:
                  type: string
                  description: Unit system.
                  enum:
                    - metric
                    - imperial
                    - si
                  example: metric
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ref:
                          type: string
                          description: Your id.
                          example: warehouse-12
                        status:
                          type: string
                          description: Result for this point.
                          enum:
                            - ok
                            - error
                          example: ok
                        forecast:
                          type: object
                          description: Same shape as the single-point response.
                          properties: {}
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"

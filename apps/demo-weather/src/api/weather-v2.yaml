  /forecasts/daily:
    get:
      operationId: getDailyForecast
      summary: Get a daily forecast
      description: Up to 16 days of daily aggregates.
      tags:
        - Forecasts
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, WGS 84.
          schema:
            type: number
            description: ""
            example: 59.9139
            minimum: -90
            maximum: 90
        - name: longitude
          in: query

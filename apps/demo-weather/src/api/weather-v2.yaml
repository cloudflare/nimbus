    WinterStormAlert:
      type: object
      description: Snow, ice, and blizzard alerts.
      required:
        - event
        - id
        - severity
        - headline
        - areas
        - onset
        - expires
      properties:
        event:
          type: string
          description: Hazard.
          enum:
            - winter_storm
          example: winter_storm
        id:
          type: string
          description: Alert id.
          example: alt_20260114_0042
        status:
          type: string
          description: CAP status.
          enum:
            - actual
            - exercise
            - test
          example: actual
        severity:
          type: string
          description: CAP severity.
          enum:
            - minor
            - moderate
            - severe
            - extreme
          example: severe
        urgency:
          type: string
          description: CAP urgency.
          enum:
            - immediate
            - expected
            - future
            - past
          example: expected
        certainty:
          type: string
          description: CAP certainty.
          enum:
            - observed
            - likely
            - possible
            - unlikely
          example: likely
        headline:
          type: string
          description: Headline.
          example: Heavy snow warning for Oslo and Akershus
        description:
          type: string
          description: Full text.
          example: 15–25 cm of snow expected between 18:00 and 06:00, locally more on high ground.
        instruction:
          type:
            - string
            - "null"
          description: What people should do.
          example: Allow extra time for travel. Public transport may be disrupted.
        sender:
          type: string
          description: Issuing agency.
          example: Norwegian Meteorological Institute
        areas:
          type: array
          items:
            $ref: "#/components/schemas/AlertArea"
        onset:
          type: string
          description: When the hazard begins.
          example: 2026-01-14T17:00:00Z
          format: date-time
        expires:
          type: string
          description: When the alert ends.
          example: 2026-01-15T05:00:00Z
          format: date-time
        references:
          type: array
          description: Earlier alerts this one updates or cancels.
          items:
            type: string
            description: ""
            example: alt_20260114_0031
        details:
          type: object
          required:
            - snowfall_cm
            - ice_accretion_mm
          properties:
            snowfall_cm:
              type: object
              properties:
                min:
                  type: number

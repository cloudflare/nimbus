version: 2
updates:
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: tuesday
    groups:
      non-major:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    ignore:
      # Types track the oldest supported Node major.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Keep 0.20.3: newer declaration bundling regressed public ApiExtensions augmentation.
      # Revisit manually with packages/nimbus-docs/test/api-extensions.test.ts.
      - dependency-name: "tsdown"
      # nimbus-docs's vite range follows the oldest Astro it supports, so a
      # site's Astro and Nimbus share one vite. Raising its floor installs a
      # second vite in sites whose Astro locked an older one. Security updates
      # still come through.
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: tuesday
    groups:
      non-major:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    ignore:
      # Types track the oldest supported Node major.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Keep 0.20.3: newer declaration bundling regressed public ApiExtensions augmentation.
      # Revisit manually with packages/nimbus-docs/test/api-extensions.test.ts.
      - dependency-name: "tsdown"

name: CI

# Red/green signal on every PR: typecheck, test, and dependency regressions.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default-deny; each job opts back into the minimum it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Root script builds nimbus-docs, then runs `pnpm -r typecheck`.
      - run: pnpm typecheck

  # `next` applies pending changesets exactly as the release PR will (versions,
  # CHANGELOGs, reviewed baselines, registry) before testing, so a test that
  # depends on the version fails here instead of on the release PR. Nothing is
  # committed.
  #
  # The nimbus-docs suite runs in four shards per lane with node's own
  # --test-shard, which sorts the matched files and deals them round-robin, so
  # every file lands on exactly one shard. `other` runs the upgrade tests and
  # the remaining packages.
  test:
    name: ${{ matrix.next && 'Test at the next release version' || 'Test' }} (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        next: [false, true]
        shard: [1/4, 2/4, 3/4, 4/4, other]
        include:
          - next: false
            fetch-depth: 1
          - next: true
            fetch-depth: 0 # changelog-github finds the commit that added each changeset
    permissions:
      contents: read
      pull-requests: read # changelog-github reads the PR behind each changeset
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - if: matrix.next
        run: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm --filter ./packages/nimbus-docs build

      - if: matrix.shard == 'other'
        run: pnpm test:upgrades

      - if: matrix.shard == 'other'
        run: pnpm -r --filter '!@cloudflare/nimbus-docs' test

      # The sample wire tests run each generated sample with its real client;
      # with CI set, a missing client fails them instead of skipping.
      - if: matrix.shard != 'other'
        run: python3 -c 'import requests' 2>/dev/null || python3 -m pip install --user --break-system-packages requests==2.32.3

      # The packed-migration test installs a published release from npm and
      # packs this one. A packed tarball can only regress at a release, so it
      # runs on main and the release PR, not on every feature PR.
      #
      # --test-timeout fails a hung test by name. A test file that outlives its
      # tests is reported and stopped by report-stuck-tests after 10 minutes.
      # No --test-force-exit: on node 24, process.exit() can deadlock joining
      # V8's compiler threads (nodejs/node#64274), so files must exit on
      # their own.
      - if: matrix.shard != 'other'
        working-directory: packages/nimbus-docs
        run: |
          node --import tsx --test --test-concurrency=4 --test-timeout=300000 --test-shard=${{ matrix.shard }} "test/**/*.test.ts" &
          tests=$!
          node ../../scripts/report-stuck-tests.mjs "$tests" 600 &
          wait "$tests"
        env:
          RUN_PACKED_MIGRATION: ${{ github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'changeset-release/') }}

  # One check under the old name. `always()` so a cancelled run gets a red
  # summary rather than a skipped one, which a required check would count as
  # passing.
  test-summary:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success || { echo "::error::test finished with result '$RESULT'"; exit 1; }
        env:
          RESULT: ${{ needs.test.result }}

  # The docs site is otherwise built only when it's deployed, after a
  # release; build it on every PR so a broken page or a framework change that
  # breaks it fails here.
  docs-site:
    name: Docs site build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@nimbus/www..." build
      # Cloudflare rejects a _redirects file with two rules for one path, and
      # Astro writes the config's redirects into it beside public/_redirects.
      - name: One _redirects rule per path
        run: |
          dups=$(awk 'NF && $1 !~ /^#/ { print $1 }' apps/www/dist/client/_redirects | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::apps/www/dist/client/_redirects has more than one rule for: $dups"
            exit 1
          fi

  # The weather demo is deployed with each release; check and build it on
  # every PR so a framework or starter change that breaks it fails here.
  demo-weather:
    name: Weather demo build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The specs and the sandbox API's answers are generated; a hand edit the
      # generator would undo, or a spec change without new answers, fails here.
      - name: Generated specs and sandbox answers are current
        run: |
          pnpm --filter @nimbus/demo-weather generate-spec
          pnpm --filter @nimbus/demo-weather fixture-api:routes
          stale=$(git status --porcelain -- apps/demo/src/api apps/demo/fixture-api/src)
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale"
            echo "::error::Run pnpm --filter @nimbus/demo-weather generate-spec and fixture-api:routes, then commit the result."
            exit 1
          fi

      # The sandbox's answers: the world, the overlay and every operation's
      # body against its response schema.
      - run: pnpm --filter @nimbus/demo-weather fixture-api:test

      # The release deploys the sandbox API from this config; it must bundle.
      - run: pnpm exec wrangler deploy --dry-run --config fixture-api/wrangler.jsonc --tsconfig "$PWD/tsconfig.json" --outdir "$RUNNER_TEMP/fixture-api"
        working-directory: apps/demo

      - run: pnpm --filter "@nimbus/demo-weather^..." build

      - run: pnpm --filter @nimbus/demo-weather check

      - run: pnpm --filter @nimbus/demo-weather build
      # The release deploys the demo with this checked-in config, not the one
      # the build writes; an adapter change that moves them apart fails here.
      - run: node scripts/deploy-config-drift.mjs apps/demo/dist/server/wrangler.json apps/demo/wrangler.deploy.json

  windows-child-process:
    name: Windows child process
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/child-process.test.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  registry-scope:
    name: Registry scope guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nimbus/www generate-registry

      # Registry payloads must import the scoped package. A bare
      # `grep 'from "nimbus-docs'` false-passes because the JSON escapes the
      # quote — match the escaped form / parse `.files[].content`.
      - name: Assert no unscoped nimbus-docs imports
        run: |
          hits=$(grep -rl 'from \\"nimbus-docs' apps/www/public/registry/components || true)
          if [ -n "$hits" ]; then
            echo "::error::Registry payloads import the unscoped nimbus-docs. Regenerate from the scoped source:"
            echo "$hits"
            exit 1
          fi

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject vulnerable production dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: false
          show-patched-versions: true

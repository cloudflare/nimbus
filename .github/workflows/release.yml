name: Release

on:
  push:
    branches: [main]
  # Redeploy the current published release's docs site and registry.
  workflow_dispatch:

# Serialize releases: never let two runs race on the version-bump PR or npm.
concurrency: ${{ github.workflow }}-${{ github.ref }}

# Default-deny; the release job opts into exactly what it needs.
permissions: {}

jobs:
  # Packs the release candidate and verifies the templates against it. The
  # verification installs the templates the way a user does, without a
  # lockfile, so it runs the newest in-range npm packages and their install
  # scripts; this job therefore holds no credentials and restores no cache.
  # The Pack step's outputs fix each tarball's integrity and the templates
  # digest before any of that runs, and the release job publishes only bytes
  # that match them. Runs on every push, so it doesn't re-derive changesets'
  # version-or-publish decision.
  verify-release:
    name: Verify release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      nimbus_integrity: ${{ steps.pack.outputs.nimbus_integrity }}
      cli_integrity: ${{ steps.pack.outputs.cli_integrity }}
      templates_digest: ${{ steps.pack.outputs.templates_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Pack
        id: pack
        run: |
          pnpm install --frozen-lockfile
          pnpm upgrades:check
          pnpm --filter ./packages/nimbus-docs --filter ./packages/create-nimbus-docs build
          node scripts/release.mjs pack --out "$RUNNER_TEMP/candidate"

      - name: Verify
        run: node scripts/release.mjs verify --from "$RUNNER_TEMP/candidate"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate/*.tgz
          if-no-files-found: error
          retention-days: 7 # a rerun after this needs a new push

  release:
    name: Release
    needs: verify-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write # push the version-bump PR branch, git tags, and the templates branch/tag
      pull-requests: write # open/update the version-bump PR
      id-token: write # npm publish provenance (OIDC)
      actions: write # the App token's own Actions:write authorizes release.mjs's verify-smoke dispatch
    steps:
      # A GitHub App installation token, not GITHUB_TOKEN: App-authored "Version
      # packages" PRs trigger CI (GITHUB_TOKEN-authored ones are suppressed), and
      # release.mjs pushes the `templates` branch + `templates-v*` tag and
      # dispatches the verify workflow using the job permissions above.
      # Secrets APP_ID / APP_PRIVATE_KEY belong to the bot App.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            nimbus

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # changesets needs full history to tag
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # No `version:` here — the root package.json `packageManager` field is the
      # single source of truth (pinning both can error on action-setup v4).
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      # No cache: a store another job wrote could put its code in this one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 0.x major-release guard: a stray `major` changeset must not publish
      # 1.0.0 unattended. Runs on the pinned Node (after setup-node) and before
      # `changeset version` consumes the changesets.
      - name: Guard against an unattended 1.0.0
        run: node scripts/check-no-major.mjs

      # Only the locked release toolchain runs here (changesets, semver, tsx),
      # with install scripts off. Packing, building and template verification
      # happened in verify-release.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate

      # Normal path. On a push with pending changesets, opens/updates the
      # "chore: bump package versions" PR (branch `changeset-release/*`). When
      # that PR is merged (no changesets remain), the
      # `publish` command runs release.mjs, which: checks the candidate's bytes
      # and the regenerated templates against verify-release's digests →
      # preflight npm latest/exact state and existing package tags → sync +
      # tag the orphan `templates` branch as `templates-v<ver>` (BEFORE a new
      # CLI publish) → publish nimbus-docs before the CLI → changeset tag →
      # dispatch the in-repo verify smoke for the new tag.
      #
      # Prerequisites (one-time, outside this file):
      #   - Repo setting: Settings → Actions → General → "Allow GitHub Actions
      #     to create and approve pull requests" must be ON (App-authored PRs
      #     still need the org/repo toggle), or the PR step fails.
      #   - Publishing uses npm Trusted Publishing (OIDC), no token secret —
      #     needs npm >= 11.5.1 (Node 24) and the npmjs.com publisher config.
      #   - Secrets APP_ID / APP_PRIVATE_KEY for the bot App, installed on the
      #     monorepo only. The App must grant Contents: read & write (branch +
      #     tag push), Pull requests: read & write (open/update the Version
      #     packages PR), and Actions: read & write (smoke dispatch) — the minted
      #     token inherits the App's permissions, so a missing Actions grant is
      #     what makes the best-effort smoke dispatch 403 silently.
      #   - Ref protection (rulesets on this repo):
      #     branch `templates` — restrict updates, bypass = the bot App;
      #     tag `templates-v*` — (a) restrict creation, bypass = the bot App,
      #     (b) block update + deletion with an EMPTY bypass list (nobody,
      #     including the App, moves a published tag). Bypass is per-ruleset, so
      #     these are two separate tag rulesets.
      #   - NPM_CONFIG_PROVENANCE requires a PUBLIC GitHub repo whose URL matches
      #     each package's `repository.url`. Going public is also the hard
      #     requirement for unauthenticated giget scaffolds (this design cannot
      #     expose templates without exposing source) — flip it public (after a
      #     full-history secret scan), or disable explicit provenance before the
      #     first real release. Keep `id-token: write` for npm Trusted Publishing.
      - name: Create version-bump PR or publish
        id: publish
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm changeset:version
          publish: node scripts/release.mjs publish --from ${{ runner.temp }}/candidate
          createGithubReleases: false # reconcile them after the published output is recorded
          commit: "chore: bump package versions"
          title: "chore: bump package versions"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_NIMBUS_INTEGRITY: ${{ needs.verify-release.outputs.nimbus_integrity }}
          RELEASE_CLI_INTEGRITY: ${{ needs.verify-release.outputs.cli_integrity }}
          RELEASE_TEMPLATES_DIGEST: ${{ needs.verify-release.outputs.templates_digest }}

      - name: Push published package tags
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        run: |
          for pkg in nimbus-docs create-nimbus-docs; do
            name=$(jq -r .name "packages/$pkg/package.json")
            version=$(jq -r .version "packages/$pkg/package.json")
            tag="$name@$version"
            if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
              git push origin "refs/tags/$tag"
            fi
          done

      # GitHub Releases are independent of the published output, so a Release
      # API failure does not skip the www deploy after npm publication.
      - name: Reconcile GitHub Releases
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        run: node scripts/reconcile-github-releases.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  build-www:
    name: Build released www
    needs: release
    if: ${{ !cancelled() && (needs.release.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # package tags locate the published release commit
          persist-credentials: false

      # A release builds its own commit. A manual run builds the newer of the
      # two packages' npm `latest` tags; the deploy job rechecks both versions.
      - name: Choose the published release commit
        id: commit
        run: |
          sha=$GITHUB_SHA
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            docs="refs/tags/@cloudflare/nimbus-docs@$(npm view @cloudflare/nimbus-docs dist-tags.latest)"
            cli="refs/tags/@cloudflare/create-nimbus-docs@$(npm view @cloudflare/create-nimbus-docs dist-tags.latest)"
            for tag in "$docs" "$cli"; do
              if ! git rev-parse --quiet --verify "$tag^{commit}" > /dev/null; then
                echo "::error::Release tag ${tag#refs/tags/} is missing."
                exit 1
              fi
            done
            if git merge-base --is-ancestor "$docs" "$cli"; then
              sha=$(git rev-parse "$cli^{commit}")
            elif git merge-base --is-ancestor "$cli" "$docs"; then
              sha=$(git rev-parse "$docs^{commit}")
            else
              echo "::error::Could not order the release tags $docs and $cli."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::Release commit $sha is not on main."
              exit 1
            fi
          fi
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nimbus/www run predeploy

      # The deploy uses the checked-in apps/www/wrangler.deploy.json, never the
      # config the build wrote; this tells a maintainer when an adapter upgrade
      # changes what it must say. A release from before www ran as a Worker
      # has no server output.
      - name: Compare the deploy config
        run: |
          if [ -f apps/www/dist/server/wrangler.json ]; then
            node scripts/deploy-config-drift.mjs apps/www/dist/server/wrangler.json apps/www/wrangler.deploy.json
            rm apps/www/dist/server/wrangler.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: released-www-dist
          path: apps/www/dist
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  deploy-www:
    name: Deploy released www
    needs: build-www
    if: ${{ !cancelled() && needs.build-www.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.build-www.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: released-www-dist
          path: apps/www/dist

      - name: Deploy only the current published release
        working-directory: apps/www
        run: |
          set -o pipefail
          for pkg in nimbus-docs create-nimbus-docs; do
            expected=$(jq -r .version "../../packages/$pkg/package.json")
            latest=$(npm view "@cloudflare/$pkg" dist-tags.latest --json | jq -er '.')
            if [ "$expected" != "$latest" ]; then
              echo "::error::@cloudflare/$pkg at this commit is $expected, but npm latest is $latest. Refusing to replace the newer site."
              exit 1
            fi
          done
          if [ -d dist/server ]; then
            # The checked-in config sits where the build's would, so `main` and
            # `assets.directory` resolve inside the download. Everything else in
            # the server output that isn't a module, a Wasm module or a source
            # map goes first: a tsconfig.json or .env there would configure the
            # deploy.
            rm -rf .wrangler
            find dist/server -mindepth 1 \( -type l -o -type f ! -name '*.mjs' ! -name '*.js' ! -name '*.wasm' ! -name '*.map' \) -delete
            find dist/server -mindepth 1 -type d -empty -delete
            cp wrangler.deploy.json dist/server/wrangler.json
            pnpm exec wrangler deploy --config dist/server/wrangler.json --tsconfig "$PWD/tsconfig.json"
          else
            # A release from before www ran as a Worker: static files only.
            pnpm exec wrangler deploy
          fi
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            https://nimbus-docs.com/registry/registry.json | jq -e \
            --arg version "$(jq -r .version ../../packages/nimbus-docs/package.json)" \
            '.registryVersion == $version'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The weather demo builds against the framework at the same release commit,
  # so it never shows a Nimbus older than the one on npm. The build runs here,
  # without credentials; the deploy job uses the checked-in
  # apps/demo/wrangler.deploy.json, never the config the build wrote.
  build-demo-weather:
    name: Build the weather demo
    needs: [build-www, deploy-www]
    if: ${{ !cancelled() && needs.deploy-www.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.build-www.outputs.sha }}
          persist-credentials: false

      # A redeploy can check out a release from before the demo had a checked-in
      # deploy config; this run's own copies stand in for files it lacks.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/deploy-config-drift.mjs
            apps/demo/wrangler.deploy.json

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "@nimbus/demo-weather..." build

      # Tells a maintainer when an adapter upgrade changes what the deploy
      # config must say.
      - name: Compare the deploy config
        run: |
          for file in scripts/deploy-config-drift.mjs apps/demo/wrangler.deploy.json; do
            [ -f "$file" ] || cp ".release-tools/$file" "$file"
          done
          node scripts/deploy-config-drift.mjs apps/demo/dist/server/wrangler.json apps/demo/wrangler.deploy.json

      - run: rm apps/demo/dist/server/wrangler.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: released-demo-dist
          path: apps/demo/dist
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  deploy-demo-weather:
    name: Deploy the weather demo
    needs: [build-www, build-demo-weather]
    if: ${{ !cancelled() && needs.build-demo-weather.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.build-www.outputs.sha }}
          persist-credentials: false

      # A redeploy can check out a release from before the demo had a checked-in
      # deploy config; this run's own copies stand in for files it lacks.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/deploy-config-drift.mjs
            apps/demo/wrangler.deploy.json

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: released-demo-dist
          path: apps/demo/dist

      # The checked-in config sits where the build's would, so `main` and
      # `assets.directory` resolve inside the download. Everything else in the
      # server output that isn't a module, a Wasm module or a source map goes
      # first: a tsconfig.json or .env there would configure the deploy.
      - name: Use the checked-in deploy config
        working-directory: apps/demo
        run: |
          rm -rf .wrangler
          find dist/server -mindepth 1 \( -type l -o -type f ! -name '*.mjs' ! -name '*.js' ! -name '*.wasm' ! -name '*.map' \) -delete
          find dist/server -mindepth 1 -type d -empty -delete
          config=wrangler.deploy.json
          [ -f "$config" ] || config=../../.release-tools/apps/demo/wrangler.deploy.json
          cp "$config" dist/server/wrangler.json

      - name: Deploy
        working-directory: apps/demo
        run: |
          set -o pipefail
          # A rerun of an older release must not replace a newer demo.
          for pkg in nimbus-docs create-nimbus-docs; do
            expected=$(jq -r .version "../../packages/$pkg/package.json")
            latest=$(npm view "@cloudflare/$pkg" dist-tags.latest --json | jq -er '.')
            if [ "$expected" != "$latest" ]; then
              echo "::error::@cloudflare/$pkg at this commit is $expected, but npm latest is $latest. Refusing to replace the newer demo."
              exit 1
            fi
          done
          # The sandbox API that Try it sends to, first, so a new demo never
          # points at an older one. A release from before it existed has none.
          if [ -f fixture-api/wrangler.jsonc ]; then
            pnpm exec wrangler deploy --config fixture-api/wrangler.jsonc --tsconfig "$PWD/tsconfig.json"
            sandbox=https://api.demo.nimbus-docs.com
            # The limit is per key, so a key of this run's own can't be used up by anyone else.
            key="wx_test_release_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            probe() { curl --fail --show-error --silent --retry 5 --retry-delay 3 -o /dev/null "$@"; }
            probe "$sandbox/v1/locations/search?q=Oslo&key=$key"
            probe -H "Authorization: Bearer $key" "$sandbox/v2/locations/search?q=Oslo"
            probe -H "Authorization: Bearer $key" "$sandbox/v3-preview/locations/search?q=Oslo"
          fi
          pnpm exec wrangler deploy --config dist/server/wrangler.json --tsconfig "$PWD/tsconfig.json"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 -o /dev/null https://demo.nimbus-docs.com/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Templates

# Guards against a generation-breaking edit to the canonical source, the
# generator, or the scaffolder — the kind that would otherwise only surface at
# release time. Scoped to the paths that can actually break generation.
on:
  push:
    branches: [main]
    paths:
      - "packages/nimbus-starter-source/**"
      - "packages/create-nimbus-docs/**"
      - "packages/nimbus-docs/**"
      - "scripts/templates-check.mjs"
      - "scripts/site-parts-check.mjs"
      - "scripts/templates-pm-check.mjs"
      - "scripts/release.mjs"
      - "scripts/release.test.mjs"
      - ".github/workflows/release.yml"
      - "scripts/fixtures/content-integrity/**"
      - ".github/workflows/templates.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/nimbus-starter-source/**"
      - "packages/create-nimbus-docs/**"
      - "packages/nimbus-docs/**"
      - "scripts/templates-check.mjs"
      - "scripts/site-parts-check.mjs"
      - "scripts/templates-pm-check.mjs"
      - "scripts/release.mjs"
      - "scripts/release.test.mjs"
      - ".github/workflows/release.yml"
      - "scripts/fixtures/content-integrity/**"
      - ".github/workflows/templates.yml"

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Netlify is covered by the pnpm@latest matrix below.
        lane: [static, vercel, node, cloudflare]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate, scaffold, and build the ${{ matrix.lane }} template
        env:
          TEMPLATES_CHECK_LANE: ${{ matrix.lane }}
        run: node scripts/templates-check.mjs

      - name: Verify every release variant without publishing
        if: matrix.lane == 'static'
        run: |
          node --test scripts/release.test.mjs
          node scripts/release.mjs publish --halt-after verify

  # Check docs and API-only scaffolds with the workspace package manager.
  site-parts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scaffold, build and check sites with an API reference
        run: node scripts/site-parts-check.mjs

  templates-modern-pnpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [static, cloudflare, netlify]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enable corepack (for pnpm@latest)
        run: corepack enable

      - name: Scaffold + install + build a template under pnpm@latest
        env:
          SCAFFOLD_PNPM: pnpm@latest
          TEMPLATES_CHECK_LANE: ${{ matrix.lane }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: node scripts/templates-check.mjs

  # Scaffold, install, build, and check both variants with each non-pnpm
  # package manager the scaffolder offers, so a failure only one of them hits
  # (Yarn 2+'s Plug'n'Play, bun's install layout) fails a PR, not a new user.
  templates-package-managers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, bun]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.package-manager == 'bun'

      - run: pnpm install --frozen-lockfile

      - name: Enable corepack (for Yarn 4)
        if: matrix.package-manager == 'yarn'
        run: corepack enable

      - name: Scaffold, install, build, and check both variants with ${{ matrix.package-manager }}
        env:
          TEMPLATES_PM: ${{ matrix.package-manager }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: node scripts/templates-pm-check.mjs
